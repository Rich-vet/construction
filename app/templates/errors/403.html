{% extends "base.html" %}

{% block title %}Access denied{% endblock %}
{% block body_class %}error-page{% endblock %}

{% block body %}
<main class="error-shell" role="main">
  <img src="{{ url_for('static', filename='images/logo-mark.svg') }}" alt="" width="48" height="48" class="error-mark">
  <p class="error-code">403</p>
  <h1 class="error-title">You do not have permission to access this page</h1>
  <p class="error-text">If you believe this is a mistake, contact your system administrator.</p>
  <a class="btn btn-primary" href="{{ url_for('main.index') }}">Return home</a>
</main>
{% endblock %}
