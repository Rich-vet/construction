{% extends "base.html" %}

{% block title %}Something went wrong{% endblock %}
{% block body_class %}error-page{% endblock %}

{% block body %}
<main class="error-shell" role="main">
  <img src="{{ url_for('static', filename='images/logo-mark.svg') }}" alt="" width="48" height="48" class="error-mark">
  <p class="error-code">500</p>
  <h1 class="error-title">Something went wrong</h1>
  <p class="error-text">Please try again. If the problem continues, contact your system administrator.</p>
  <a class="btn btn-primary" href="{{ url_for('main.index') }}">Return home</a>
</main>
{% endblock %}
